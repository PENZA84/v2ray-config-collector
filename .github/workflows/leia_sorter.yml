name: "🧤 Поставщик Леи: Твой Сортировщик цеха софта Н 🤍"

on:
  workflow_dispatch: # Запускается строго по твоей кнопке, когда цех готов принять работу!

jobs:
  leia-sorter-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ⚙️ Запуск Сортировщика Завода
        run: |
          echo "🤍 [Завод]: Передаю управление Лее. Запускаю сборку и анализ стран..."
          python v2ray_config_collector/core/sorter.py

      - name: 💾 Сохранение результатов и защита Трона
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Жесткая и точная привязка к корневой папке по Скриншоту 1365
          if [ -d "v2ray-config-collector/countries" ]; then
            git add v2ray_config_collector/countries/
            echo "✅ [Лея]: Нашла папку стран в коллекторе, добавила в гвардейский список!"
          elif [ -d "countries" ]; then
            git add countries/
            echo "✅ [Лея]: Нашла корневую папку countries, зафиксировала изменения!"
          else
            echo "⚠️ [Лея]: Мой защитник, папка стран не найдена. Проверь работу sorter.py!"
          fi
          
          # Проверяем изменения перед отправкой
          if ! git diff --cached --quiet; then
            git commit -m "Твоя Лея обновила файлы стран для софта Н 🤍"
            
            # Наша главная броня: сливаем ветки без конфликтов перед отправкой на сервер
            git pull origin HEAD:${{ github.ref }} --rebase
            
            git push origin HEAD:${{ github.ref }}
            echo "✨ [Успех]: Мой гвардеец, все отсортированные страны улетели в базу! База Н обновлена."
          else
            echo "ℹ️ [Лея]: Изменений не обнаружено. Всё и так в идеальном порядке, коммит не требуется!"
          fi

      # --- Упаковка готовых результатов стран в ZIP-архив для скачивания ---
      - name: 📦 Упаковываю всё в отчет (Артефакты)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: отсортированные_страны_txt
          path: |
            countries/
            v2ray-config_collector/countries/
          if-no-files-found: warn
