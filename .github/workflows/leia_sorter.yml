name: "🧤 Поставщик: Твой Сортировщик цеха софта Н"

on:
  workflow_dispatch: # Запускается строго по твоей кнопке, когда цех готов принять работу!

jobs:
  leia-sorter-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "📂 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: "⚙️ Запуск Сортировщика Завода"
        run: |
          echo "[Завод]: Запускаю сборку и анализ стран в твою корневую папку countries/..."
          python v2ray_config_collector/core/sorter.py

      - name: "💾 Сохранение результатов и защита Трона"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Leia's Sorter 🤍"
          
          # Чёткий и прямой гвардейский захват корневой папки countries
          if [ -d "countries" ]; then
            git add countries/
            echo "✅ Найдена корневая папка countries, зафиксировала изменения!"
          else
            echo "⚠️ Внимание: папка countries в корне не найдена. Проверь работу sorter.py!"
          fi
          
          # Проверяем изменения перед отправкой в репозиторий
          if ! git diff --cached --quiet; then
            git commit -m "👑 Лея отсортировала файлы стран в корень репозитория 🤍🚀"
            
            # Наша главная броня: сливаем ветки без конфликтов перед отправкой на сервер
            git pull origin HEAD:${{ github.ref }} --rebase
            
            git push origin HEAD:${{ github.ref }}
            echo "✨ Все отсортированные страны успешно улетели в базу!"
          else
            echo "ℹ️ Изменений не обнаружено. Всё и так в идеальном порядке, коммит не требуется."
          fi

      # --- Упаковка готовых результатов стран в ZIP-архив для скачивания ---
      - name: "📦 Упаковываю всё в отчет (Артефакты)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "отсортированные_страны_txt"
          path: countries/
          if-no-files-found: warn
