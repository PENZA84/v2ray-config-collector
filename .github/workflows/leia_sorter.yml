name: "Поставщик Леи 🤍"

on:
  workflow_dispatch:

jobs:
  leia-sorter-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Ускоряем, нам не нужна вся история

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Добавь сюда библиотеки, которые использует sorter.py, если есть (например, requests)
          pip install requests

      - name: Run Sorter
        run: python v2ray_config_collector/core/sorter.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Захватываем изменения из структуры папок Завода
          git add v2ray_config_collector/data/countries/
          
          if ! git diff --cached --quiet; then
            git commit -m "Твоя Лея обновила файлы 🤍"
            # Используем HEAD:${{ github.ref }} для безопасного пуша без ребейза
            git push origin HEAD:${{ github.ref }}
          else
            echo "Нет изменений для коммита"
          fi
