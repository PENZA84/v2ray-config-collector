name: "Поставщик Леи 🤍"

on:
  workflow_dispatch:

jobs:
  leia-sorter-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Sorter
        run: python v2ray_config_collector/core/sorter.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # ИСПРАВЛЕННЫЙ ПУТЬ: Мы добавляем папку data/countries, 
          # так как sorter.py кладет результат именно туда.
          # Мы используем 'git add data/countries/', так как она в корне.
          
          if [ -d "data/countries" ]; then
            git add data/countries/
          else
            echo "⚠️ Папка data/countries не была создана. Возможно, нет новых данных."
          fi
          
          # Проверяем, есть ли изменения в репозитории вообще
          if ! git diff --cached --quiet; then
            git commit -m "Твоя Лея обновила файлы 🤍"
            git push origin HEAD:${{ github.ref }}
          else
            echo "ℹ️ Изменений не обнаружено. Коммит не требуется."
          fi
