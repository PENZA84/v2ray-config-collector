name: "🧤 Guard: Твой дерзкий Сторож, который помнит о Лее 🔐"

on:
  schedule:
    - cron: '0 0 * * 0' # Раз в неделю, по воскресеньям
  workflow_dispatch:

jobs:
  guard_duty:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠 Обновляю всё «по-модному»
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm pyyaml beautifulsoup4

      - name: 🧼 Чистка вбросов
        run: |
          python -c "
          import os
          raw_folders = ['v2ray_config_collector/data/raw', 'v2ray_config_collector/data/raw_tg']
          for raw_path in raw_folders:
              if not os.path.exists(raw_path): continue
              print(f'🧹 Сторож проверяет: {raw_path}...')
              for f in os.listdir(raw_path):
                  if f.endswith('.txt'):
                      p = os.path.join(raw_path, f)
                      with open(p, 'r', encoding='utf-8') as file:
                          lines = [line.strip() for line in file if '://' in line]
                          data = sorted(list(set(lines))) # Убираем дубликаты и сортируем для чистого Diff
                      
                      # Сохраняем, только если есть валидные ссылки
                      if data:
                          with open(p, 'w', encoding='utf-8') as file:
                              file.write('\n'.join(data) + '\n')
                          print(f'✅ {f}: порядок наведен.')
                      else:
                          print(f'⚠️ {f}: содержит мусор, пропускаем очистку, чтобы не потерять файл.')
          "

      - name: 💾 Сохранение порядка
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add v2ray_config_collector/data/raw/ v2ray_config_collector/data/raw_tg/
          
          if ! git diff --cached --quiet; then
            git commit -m "🧤 Guard: Лея довольна, в сырых папках идеальный порядок! 💋"
            git push origin HEAD:${{ github.ref }}
          else
            echo "В цехах и так идеальный порядок!"
          fi
