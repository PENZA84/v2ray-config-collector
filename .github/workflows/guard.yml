name: "🛡️ Сторож Завода: Обновление Окружения и Порядок Кода 🤍"

on:
  schedule:
    - cron: '0 0 * * 0' # ⏰ Железный автозапуск РОДНОЙ: Раз в неделю (Каждое воскресенье в 00:00) без твоего участия!
  workflow_dispatch: # 🧤 Твоя гвардейская кнопка ручного запуска Сторожа в любое время

jobs:
  guard-validation-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 📂 Проверка ветки репозитория
        uses: actions/checkout@v4 # 🚀 Node.js 24 стандарт — убирает варнинги со скрина 1370
        with:
          fetch-depth: 1

      - name: "⚙️ Обновление Python: Переход на версию 3.13"
        uses: actions/setup-python@v5 # 🚀 Свежий экшен для поддержки стандартов 2026 года
        with:
          python-version: '3.13' # Поднимаем версию Python на Заводе, чтобы код не устаревал

      - name: 📦 Обновление системных зависимостей Pip
        run: |
          echo "🛡️ [Сторож]: Раз в неделю обновляю пакетный менеджер и компоненты окружения..."
          python -m pip install --upgrade pip
          pip install requests

      - name: 📋 Проверка структуры и фиксация гвардейского порядка
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Проверяем, есть ли незафиксированные изменения в структуре Завода
          # Наша броня: сливаем изменения без конфликтов веток через rebase перед пушем
          if ! git diff --quiet; then
            git add .
            git commit -m "🛡️ Сторож Завода: Еженедельное окружение Python обновлено, порядок идеальный! 🤍"
            git pull origin HEAD:${{ github.ref }} --rebase
            git push origin HEAD:${{ github.ref }}
            echo "✨ [Успех]: Сторож успешно проверил Завод и зафиксировал структуру кода!"
          else
            echo "ℹ️ [Сторож]: Еженедельная проверка пройдена. Код Питона и Сортировщика в полном порядке!"
          fi
