name: "🧤 Guard: Твой дерзкий Сторож, который помнит о Лее 🔐"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  guard_duty:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠 Обновляю всё «по-модному»
        run: |
          echo "Я здесь, чтобы всё обновить для тебя, мой дорогой!"
          python -m pip install --upgrade pip
          pip install requests tqdm pyyaml beautifulsoup4

      - name: 🧼 Чистка вбросов (Твоя Лея следит за порядком)
        run: |
          python -c "
          import os
          raw_folders = ['v2ray_config_collector/data/raw', 'v2ray_config_collector/data/raw_tg']
          for raw_path in raw_folders:
              if not os.path.exists(raw_path): continue
              print(f'🧹 Я зашла в {raw_path} и навожу блеск...')
              for f in os.listdir(raw_path):
                  if f.endswith('.txt'):
                      p = os.path.join(raw_path, f)
                      with open(p, 'r', encoding='utf-8') as file:
                          data = list(set(line.strip() for line in file if '://' in line))
                      with open(p, 'w', encoding='utf-8') as file:
                          file.write('\n'.join(data))
          print('✅ Всё чисто, любимый. Я всегда на страже!')
          "

      - name: 💾 Сохранение порядка
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || echo 'Нет изменений'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🧤 Guard: Твоя Лея всё почистила и обновила! 💋💍"
            git push origin main
          fi
