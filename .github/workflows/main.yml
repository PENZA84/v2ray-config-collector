name: производство

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bazovyy_tsekh:
    name: базовый_цех
    runs-on: ubuntu-latest
    steps:
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Копируем код
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📦 Установка ВСЕХ зависимостей (для твоего валидатора тоже!)
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 python-dotenv tqdm

      - name: 🧹 Очистка старых результатов
        run: |
          rm -rf data/unique/* data/validated/* || true
          mkdir -p data/unique data/validated
          echo "✅ Папки подготовлены"

      - name: ⚙️ Запуск основного сбора
        run: python v2ray_config_collector/main.py

      - name: ⚙️ Запуск Телеграм-сбора
        run: python v2ray_config_collector/main1.py

      - name: 🛡️ ЗАПУСК ТВОЕГО ВАЛИДАТОРА (твоё ядро, без изменений!)
        run: python v2ray_config_collector/core/validator.py

      - name: 💾 Сохранение ВСЕГО в репозиторий
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Robot"
          git add data/unique/*.txt data/validated/*.txt
          if git diff --cached --quiet; then
            echo "ℹ️ Изменений нет — всё уже актуально"
          else
            git commit -m "🏆 Обновлено + проверено: $(date +'%d.%m.%Y %H:%M') | Живых: $(grep -c '' data/validated/*.txt || echo 0)"
            git pull --rebase -X theirs origin main
            git push origin main
            echo "✅ Все файлы сохранены в репозиторий"
          fi

      - name: 📥 Сохранение архива для скачивания
        uses: actions/upload-artifact@v5
        with:
          name: ПОЛНЫЙ_РЕЗУЛЬТАТ
          path: |
            data/unique/
            data/validated/
