name: "Производство Леи 🤍"

on:
  workflow_dispatch:   # Ручной запуск в любой момент

permissions:
  contents: write

# ГЛУШИТЕЛЬ ПРЕДУПРЕЖДЕНИЙ NODE: Защита экрана от жёлтых плашек GitHub
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ==========================================
  # ЭТАП 1: МАТРИЦА ДЛЯ ТЕЛЕГРАМА (8 ОКОН: Разведчик + 7 рабочих)
  # ==========================================
  telegram_collector:
    name: "Поток Телеграм 🚀 (Окно №${{ matrix.window_index }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        window_index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: "📂 Копирую код"
        uses: actions/checkout@v4.2.2

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'

      - name: "📦 Установка зависимостей"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4

      - name: "⚡ Запуск параллельного сбора"
        run: |
          python -u v2ray_config_collector/main1.py --window ${{ matrix.window_index }} --chunk-size 2500
        env:
          PYTHONUNBUFFERED: 1

      - name: "📤 Отправка временного файла"
        uses: actions/upload-artifact@v4.6.0
        with:
          name: "tg_chunk_${{ matrix.window_index }}"
          path: data/raw_incoming/extracted_documents.txt
          retention-days: 1

  # ==========================================
  # ЭТАП 2: РАФ-РАСПАКОВКА И ДЕДУПЛИКАЦИЯ
  # ==========================================
  data_preparation:
    name: "Очистка и Разбивка 🏭"
    needs: telegram_collector
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Подготавливаю рабочее пространство"
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'

      - name: "📦 Установка зависимостей"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 tqdm

      - name: "📥 Стягиваю временные файлы Телеграма"
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: "tg_chunk_*"
          path: data/incoming_chunks/

      - name: "🤝 Подготовка файла для Дедупликатора"
        run: |
          mkdir -p data/raw_incoming
          for window_dir in data/incoming_chunks/tg_chunk_*; do
            if [ -f "$window_dir/extracted_documents.txt" ]; then
              cat "$window_dir/extracted_documents.txt" >> data/raw_incoming/deep_raw_collected.txt
            fi
          done
          rm -rf data/incoming_chunks
          echo "✅ Телеграм-база готова для Дедупликатора!"

      - name: "⚙️ РАФ-обработка источников (main.py)"
        run: |
          python -u v2ray_config_collector/main.py
        env:
          PYTHONUNBUFFERED: 1

      - name: "💎 ЦЕХ ОГРАНКИ: Удаление дубликатов (deduplicator.py)"
        run: |
          python -u v2ray_config_collector/core/deduplicator.py
        env:
          PYTHONUNBUFFERED: 1

      - name: "🧩 Формирование 5 кусков для Валидатора"
        run: |
          python v2ray_config_collector/core/split_configs.py

      - name: "📤 Загрузка кусков в облако"
        uses: actions/upload-artifact@v4.6.0
        with:
          name: "chunks_for_validation"
          path: data/unique/chunk_*.txt
          retention-days: 1

  # ==========================================
  # ЭТАП 3: ПАРАЛЛЕЛЬНАЯ ВАЛИДАЦИЯ В СТОЛБИК
  # ==========================================
  parallel_validator:
    name: "Валидатор 🛡️ (Кусок №${{ matrix.chunk_id }})"
    needs: data_preparation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk_id: ['001', '002', '003', '004', '005']
    steps:
      - name: "📂 Копирую код"
        uses: actions/checkout@v4.2.2

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'

      - name: "📦 Инструменты Валидатора"
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm playwright
          playwright install-deps chromium
          playwright install chromium

      - name: "📥 Беру свой кусок на проверку"
        uses: actions/download-artifact@v4.1.8
        with:
          name: "chunks_for_validation"
          path: data/unique/

      - name: "🛡️ Проверяю адреса в куске №${{ matrix.chunk_id }}"
        run: |
          if [ -f "data/unique/chunk_${{ matrix.chunk_id }}.txt" ]; then
            python -u v2ray_config_collector/core/validator.py --input data/unique/chunk_${{ matrix.chunk_id }}.txt
          fi

      - name: "📤 Отправка проверенного куска"
        uses: actions/upload-artifact@v4.6.0
        with:
          name: "validated_chunk_${{ matrix.chunk_id }}"
          path: data/unique/
          retention-days: 1

  # ==========================================
  # ЭТАП 4: СЛИЯНИЕ И ФИНАЛЬНОЕ СОХРАНЕНИЕ С КРАСИВОЙ НАРЕЗКОЙ ДЛЯ ТРОНА
  # ==========================================
  final_commit:
    name: "Сохранение на Заводе 💾"
    needs: parallel_validator
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Подготавливаю пространство"
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: "📥 Скачиваю все 5 результатов"
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: "validated_chunk_*"
          path: temp_validated/

      - name: "🤝 Изящное слияние файлов и защитная нарезка"
        run: |
          mkdir -p data/unique
          python -c "
          import os, glob
          out_dir = 'data/unique'
          os.makedirs(out_dir, exist_ok=True)
          
          # Очищаем только старые текстовые файлы баз, не ломая структуру каталогов
          for f in glob.glob(os.path.join(out_dir, '*.txt')):
            try: os.remove(f)
            except: pass
          
          files = glob.glob('temp_validated/*/*_chunk_*.txt') + glob.glob('temp_validated/*/*/*_chunk_*.txt')
          proto_data = {}
          
          for f in files:
              filename = os.path.basename(f)
              if '_chunk_' in filename:
                  proto_name = filename.split('_chunk_')[0]
              else:
                  continue
                  
              if not proto_name:
                  continue
                  
              if proto_name not in proto_data:
                  proto_data[proto_name] = set()
                  
              with open(f, 'r', encoding='utf-8') as file_in:
                  for line in file_in:
                      line_clean = line.strip()
                      if line_clean and not line_clean.startswith('#'):
                          proto_data[proto_name].add(line_clean)
          
          # Нарезка по 80 000 строк с идеальным именованием (proto.txt, proto1.txt, proto2.txt...)
          LIMIT = 80000
          for proto, lines in proto_data.items():
              sorted_lines = sorted(list(lines))
              total = len(sorted_lines)
              part = 1
              for i in range(0, total, LIMIT):
                  chunk = sorted_lines[i:i+LIMIT]
                  
                  # ИДЕАЛЬНОЕ ИМЕНОВАНИЕ ДЛЯ ТРОНА: Первый файл чистый, последующие — по порядку без подчёркиваний
                  if part == 1:
                      out_name = f'{proto}.txt'
                  else:
                      out_name = f'{proto}{part-1}.txt'
                      
                  with open(os.path.join(out_dir, out_name), 'w', encoding='utf-8') as file_out:
                      file_out.write(f'# Valid {proto.upper()} Configurations - Part {part}\n')
                      file_out.write(f'# Total links in this file: {len(chunk)}\n\n')
                      file_out.write('\n'.join(chunk) + '\n')
                  print(f'✂️ Сборка общего списка data/unique/{out_name}... [Строк: {len(chunk)}]')
                  part += 1
          "
          rm -rf temp_validated
          echo "✅ Новая чистая база успешно собрана воедино и нарезана по частям!"

      - name: "💾 Сохраняю результаты нашего труда"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Leia's Assistant 🤍"
          
          git add data/unique/
          
          if ! git diff --cached --quiet; then
            git commit -m "🏆 Лея завершила сборку: Полная база проверена на 8 потоках и нарезана! 🤍"
            
            for i in {1..10}; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "⚠️ Ветка занята, пробуем снова..."
              sleep $((1 + RANDOM % 5))
            done
            echo "✅ Все изменения успешно сохранены!"
          else
            echo "ℹ️ Изменений не обнаружено."
          fi
