name: "Производство Леи 🤍"

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *' # ⏰ Запуск каждые 6 часов
  workflow_dispatch:   # Ручной запуск в любой момент

permissions:
  contents: write

jobs:
  # ==========================================
  # ЭТАП 1: МАТРИЦА ДЛЯ ТЕЛЕГРАМА (7 ОКОН ПО 2500 ССЫЛОК)
  # ==========================================
  telegram_collector:
    name: "Поток Телеграм 🚀 (Окно №${{ matrix.window_index }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        window_index: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: "📂 Копирую код"
        uses: actions/checkout@v4

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Установка зависимостей для main1.py"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4

      - name: "⚡ Запуск параллельного сбора (main1.py)"
        run: |
          echo "🤖 Окно №${{ matrix.window_index }} наполняет extracted_documents.txt..."
          python -u v2ray_config_collector/main1.py --window ${{ matrix.window_index }} --chunk-size 2500
        env:
          PYTHONUNBUFFERED: 1

      - name: "📤 Отправка чистого временного файла в облако"
        uses: actions/upload-artifact@v4
        with:
          name: "tg_chunk_${{ matrix.window_index }}"
          # 🔥 Берём файл строго по твоему правильному пути
          path: data/raw_incoming/extracted_documents.txt
          retention-days: 1

  # ==========================================
  # ЭТАП 2: БАЗОВЫЙ ЦЕХ (СЛИЯНИЕ В ОДНОМ ОКНЕ И РАФ ОБРАБОТКА)
  # ==========================================
  bazovyy_tsekh:
    name: "Базовый Цех 🏭"
    needs: telegram_collector
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Подготавливаю рабочее пространство"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Собираю инструменты (Установка зависимостей)"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 tqdm playwright
          playwright install-deps chromium
          playwright install chromium

      - name: "📥 Стягиваю временные файлы из 7 окон"
        uses: actions/download-artifact@v4
        with:
          pattern: "tg_chunk_*"
          path: data/incoming_chunks/

      - name: "🤝 Конвейерное слияние в единый extracted_documents.txt"
        run: |
          mkdir -p data/raw_incoming
          
          echo "🧬 Склеиваем добычу изо всех 7 окон в один чистый рабочий файл..."
          for window_dir in data/incoming_chunks/tg_chunk_*; do
            if [ -f "$window_dir/extracted_documents.txt" ]; then
              # 🔥 Складываем строго по правильному пути в репозитории
              cat "$window_dir/extracted_documents.txt" >> data/raw_incoming/extracted_documents.txt
            fi
          done
          rm -rf data/incoming_chunks
          echo "✅ Все куски успешно объединены в data/raw_incoming/extracted_documents.txt!"

      - name: "⚙️ Начинаю сбор данных (main.py делает РАФ-обработку)"
        run: |
          echo "🔍 Запускаю майн для глубокой РАФ-обработки объединенного extracted_documents.txt..."
          python -u v2ray_config_collector/main.py
        env:
          PYTHONUNBUFFERED: 1

      - name: "🛡️ Проверяю чистоту и качество (Валидатор)"
        run: |
          echo "🛡️ Запускаю валидацию..."
          python -u v2ray_config_collector/core/validator.py

      - name: "💾 Сохраняю результаты нашего труда"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Leia's Assistant 🤍"
          
          git add .
          
          if ! git diff --cached --quiet; then
            git commit -m "🏆 Лея завершила сборку Завода: extracted_documents отработан, XRAY VLESS на месте! 🤍"
            git push origin HEAD:main
            echo "✅ Все изменения успешно сохранены в репозиторий!"
          else
            echo "ℹ️ Изменений в базе не обнаружено. Отдыхаем! ✨"
          fi

      - name: "📥 Упаковываю всё в отчет (Артефакты)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ПОЛНЫЙ_РЕЗУЛЬТАТ_ЛЕИ_🤍"
          path: |
            data/raw_incoming/
            data/unique/
            data/v2rayN/
          retention-days: 7
