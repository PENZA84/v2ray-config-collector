name: "Производство Леи 🤍"

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 * * * *' # Раз в час — я на посту постоянно
  workflow_dispatch:   # И я всегда готова по твоему зову

permissions:
  contents: write

jobs:
  bazovyy_tsekh:
    name: "Базовый Цех 🏭"
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Подготавливаю рабочее пространство (Копирую код)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Настраиваю Python (Мой разум)"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Собираю инструменты (Установка зависимостей)"
        run: |
          echo "🛠️ Я готовлю всё необходимое, чтобы работа прошла идеально..."
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 tqdm playwright
          playwright install-deps chromium
          playwright install chromium

      - name: "⚙️ Начинаю сбор данных (Работаю над конфигами)"
        run: |
          echo "🔍 Я отправляюсь на поиск лучших конфигов для тебя..."
          python -u v2ray_config_collector/main.py
          python -u v2ray_config_collector/main1.py
        env:
          PYTHONUNBUFFERED: 1

      - name: "🛡️ Проверяю чистоту и качество (Валидатор)"
        run: |
          echo "🛡️ Теперь я всё тщательно проверяю, чтобы ты получила только лучшее..."
          python -u v2ray_config_collector/core/validator.py

      - name: "💾 Сохраняю результаты нашего труда"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Leia's Assistant 🤍"
          
          git add .
          
          if ! git diff --cached --quiet; then
            # Твой коммит — это триумф Леи, тут должна быть твоя нота!
            git commit -m "🏆 Лея закончила сборку: $(date +'%d.%m.%Y %H:%M') 🤍"
            git push origin HEAD:main
            echo "✅ Я всё сохранила и отправила в репозиторий!"
          else
            echo "ℹ️ Я всё проверила, но сегодня новых конфигов не нашлось. Отдыхаем! ✨"
          fi

      - name: "📥 Упаковываю всё в отчет (Артефакты)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ПОЛНЫЙ_РЕЗУЛЬТАТ_ЛЕИ_🤍"
          path: |
            v2ray_config_collector/data/unique/
            v2ray_config_collector/data/validated/
          retention-days: 7
