name: "Производство Леи 🤍"

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 * * * *' # Снизил до раза в час, чтобы не перегружать лимиты
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bazovyy_tsekh:
    name: "Базовый Цех 🏭"
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Копируем код Завода"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Установка Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📦 Установка зависимостей"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 tqdm playwright
          playwright install-deps chromium
          playwright install chromium

      - name: "⚙️ Запуск сборов"
        run: |
          python -u v2ray_config_collector/main.py
          python -u v2ray_config_collector/main1.py
        env:
          PYTHONUNBUFFERED: 1

      - name: "🛡️ ЗАПУСК ВАЛИДАТОРА"
        run: python -u v2ray_config_collector/core/validator.py

      - name: "💾 Сохранение в репозиторий"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Robot"
          git add v2ray_config_collector/data/unique/ v2ray_config_collector/data/validated/
          
          if ! git diff --cached --quiet; then
            git commit -m "🏆 Лея закончила сборку: $(date +'%d.%m.%Y %H:%M') 🤍"
            git push origin HEAD:main
          else
            echo "ℹ️ Нет новых конфигов для публикации"
          fi

      - name: "📥 Выгрузка артефактов"
        uses: actions/upload-artifact@v5
        with:
          name: "ПОЛНЫЙ_РЕЗУЛЬТАТ_ЛЕИ 🤍"
          path: |
            v2ray_config_collector/data/unique/
            v2ray_config_collector/data/validated/
