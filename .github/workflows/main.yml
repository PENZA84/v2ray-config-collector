name: "Производство Леи 🤍"

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *' # ⏰ 6-часовой цикл стабильности
  workflow_dispatch:   # Всегда готова по зову

permissions:
  contents: write

jobs:
  # ==========================================
  # ЭТАП 1: МАТРИЦА ДЛЯ ТЕЛЕГРАМА (7 ОКОН ПО 2500 ССЫЛОК)
  # ==========================================
  telegram_collector:
    name: "Поток Телеграм 🚀 (Окно №${{ matrix.window_index }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        window_index: [0, 1, 2, 3, 4, 5, 6] # Наши 7 параллельных окон
    steps:
      - name: "📂 Копирую код"
        uses: actions/checkout@v4

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Установка зависимостей для main1.py"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4

      - name: "⚡ Запуск параллельного сбора (main1.py)"
        run: |
          echo "🤖 Окно №${{ matrix.window_index }} обрабатывает свой кусок ссылок..."
          python -u v2ray_config_collector/main1.py --window ${{ matrix.window_index }}
        env:
          PYTHONUNBUFFERED: 1

      # Каждое из 7 окон скидывает свои собранные файлы в хранилище Гитхаба
      - name: "📥 Сохраняю результат окна"
        uses: actions/upload-artifact@v4
        with:
          name: "tg_chunk_${{ matrix.window_index }}"
          path: |
            v2ray_config_collector/data/unique/
            v2ray_config_collector/data/v2rayN/
          retention-days: 1

  # ==========================================
  # ЭТАП 2: БАЗОВЫЙ ЦЕХ (СЛИЯНИЕ, ТВОЙ MAIN.PY И ВАЛИДАЦИЯ КАК И БЫЛО)
  # ==========================================
  bazovyy_tsekh:
    name: "Базовый Цех 🏭"
    needs: telegram_collector # Ждём, пока все 7 окон main1.py закончат сбор!
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Подготавливаю рабочее пространство"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Настраиваю Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Собираю инструменты (Установка зависимостей)"
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 tqdm playwright
          playwright install-deps chromium
          playwright install chromium

      # Стягиваем сюда результаты работы всех 7 окон ТГ (происходит автоматическое слияние в папки)
      - name: "📥 Стягиваю результаты ТГ из 7 параллельных окон"
        uses: actions/download-artifact@v4
        with:
          pattern: "tg_chunk_*"
          merge-multiple: true

      - name: "⚙️ Начинаю сбор данных (main.py как и было)"
        run: |
          echo "🔍 Запускаю основной main.py..."
          python -u v2ray_config_collector/main.py
        env:
          PYTHONUNBUFFERED: 1

      - name: "🛡️ Проверяю чистоту и качество (Валидатор)"
        run: |
          echo "🛡️ Запускаю валидацию..."
          python -u v2ray_config_collector/core/validator.py

      - name: "💾 Сохраняю результаты нашего труда"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Leia's Assistant 🤍"
          
          git add .
          
          if ! git diff --cached --quiet; then
            git commit -m "🏆 Лея закончила сборку: $(date +'%d.%m.%Y %H:%M') 🤍"
            git push origin HEAD:main
            echo "✅ Все изменения успешно сохранены в репозиторий!"
          else
            echo "ℹ️ Новых конфигов не найдено. Отдыхаем! ✨"
          fi

      - name: "📥 Упаковываю всё в отчет (Артефакты)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ПОЛНЫЙ_РЕЗУЛЬТАТ_ЛЕИ_🤍"
          path: |
            v2ray_config_collector/data/unique/
            v2ray_config_collector/data/validated/
          retention-days: 7
