name: 🏭 Заводской Автономный Сортировщик (Factory Grabber)

on:
  workflow_dispatch: # 🔘 Кнопка ручного запуска в панели Actions

permissions:
  contents: write

jobs:
  run-factory-grabber:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Развертывание Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ========================================================
      # 🌐 ВОТ ТУТ МЫ СТРОИМ НАШ НАСТОЯЩИЙ КЛИКЕР С БРАУЗЕРОМ!
      # ========================================================
      - name: ⚙️ Установка Playwright и его системных зависимостей
        run: |
          pip install playwright requests
          # Устанавливаем сам Chromium и все нужные Linux-библиотеки для него:
          playwright install chromium --with-deps 

      - name: 🤖 Запуск скрытого браузера (Клик по сложным сайтам)
        run: python factory_grabber.py
        # Теперь этот скрипт НЕ упадет, потому что в системе есть живой браузер!

      # ========================================================
      # 📤 СДАЧА СМЕНЫ В РЕПОЗИТОРИЙ
      # ========================================================
      - name: 📤 Сохранение результатов и очистка бункера в Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/unique/*.txt data/raw_incoming/deep_raw_collected.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "🏭 Завод: Браузерный кликер отработал. Улов собран, бункер зачищен."
            git push origin HEAD:${{ github.ref }}
            echo "✅ Изменения успешно отправлены в репозиторий!"
          else
            echo "ℹ️ Никаких изменений не обнаружено."
          fi
