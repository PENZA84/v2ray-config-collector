name: "🧹 Сортировщик и Разбивка на Чанки 💋"

on:
  workflow_dispatch:

jobs:
  run-cleaner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: 🌱 Prepare environment
        run: mkdir -p urls/urls data/raw_incoming

      - name: 🔀 1. Разбивка на чанки
        run: python urls/splitter.py

      - name: 🔄 2. Обработка чанков
        run: python urls/sorter.py

      - name: 🚀 Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add urls/source_urls.txt urls/urls/*.txt
          git add urls/factory_valid.txt urls/url_checks.txt urls/filtered_results.txt
          git add data/raw_incoming/deep_raw_collected.txt
          
          if git diff --staged --quiet; then
            echo "✨ Нет изменений"
          else
            git commit -m "🧹 Сортировщик: полная обработка 💋"
            git push
          fi
