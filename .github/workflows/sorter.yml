name: 'Поставщик Леи 🤍'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  leia-sorter-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          pip install aiohttp
          cd v2ray_config_collector/core
          python -u sorter.py
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Удаляем старые огромные файлы, чтобы они не мешали
          find countries/ -name "*.txt" -size +95M -delete
          git add countries/ ip_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Сортировка: данные нарезаны для GitHub. 🤍"
            git push
          fi
