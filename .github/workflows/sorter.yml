name: "Поставщик Леи 🤍"
on:
  workflow_dispatch:
jobs:
  leia-sorter-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run pip install aiohttp
        run: pip install aiohttp
      - name: Run Sorter
        run: python v2ray_config_collector/core/sorter.py
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Добавляем все изменения из папки countries
          git add countries/ ip_cache.json
          # Проверяем, есть ли что сохранять
          if ! git diff --cached --quiet; then
            git commit -m "Твоя Лея обновила файлы 🤍"
            git push origin main
          else
            echo "Файлы уже обновлены, мой родной!"
          fi
