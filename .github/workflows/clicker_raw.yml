name: "Автоматический Кликер Raw Профилей 🤍"

on:
  workflow_dispatch: # Запуск ТОЛЬКО вручную по кнопке

jobs:
  run-grabber:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Скачивание репозитория
        uses: actions/checkout@v4
        with:
          persist-credentials: true

          - name: 🛠️ Настройка среды Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Стабильная версия, на которой Playwright летает без ошибок
          cache: 'pip'

      - name: 🚀 Установка библиотек и скрытого браузера Chromium
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp playwright
          # Скачиваем сам Chromium и системные зависимости для Linux
          playwright install --with-deps chromium

      - name: 🎯 Сборка и фильтрация сырых ссылок
        run: |
          python clicker/clicker_raw.py --output clicker/raw_links.txt

      - name: 💾 Фиксация изменений и безопасный пуш
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet clicker/raw_links.txt; then
            echo "🤖 Изменений в raw_links.txt нет. Пропускаем пуш."
          else
            git add clicker/raw_links.txt
            git commit -m "Кликер: Обновлен список сырых ссылок raw_links.txt 🤍"
            git pull --rebase origin main
            git push origin main
          fi
