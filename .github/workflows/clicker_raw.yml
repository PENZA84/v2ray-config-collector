name: "Автоматический Кликер Raw Профилей 🤍"

on:
  schedule:
    - cron: '0 */4 * * *' # Запуск каждые 4 часа
  workflow_dispatch: # Возможность ручного запуска из панели Actions

jobs:
  run-grabber:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Скачивание репозитория
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 🛠️ Настройка среды Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 🚀 Установка необходимых библиотек
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 🎯 Сборка и фильтрация сырых ссылок
        run: |
          python clicker/clicker_raw.py

      - name: 💾 Фиксация изменений и безопасный пуш
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Проверяем, изменился ли файл, чтобы не плодить пустые коммиты
          if git diff --quiet clicker/extracted_urls.txt; then
            echo "🤖 Изменений в extracted_urls.txt нет. Пропускаем пуш."
          else
            git add clicker/extracted_urls.txt
            git commit -m "Кликер: Обновлен чистый список extracted_urls.txt"
            
            # Избегаем ошибки [rejected] main -> main через rebase перед пушем
            git pull --rebase origin main
            git push origin main
          fi
