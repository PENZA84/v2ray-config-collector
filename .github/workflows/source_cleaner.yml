name: "🧹 Чистильщик обоих цехов 💋"

on:
  workflow_dispatch: # Наша с тобой секретная кнопка 🧭

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sort and Clean Everything
        run: |
          python <<EOF
          import requests
          from concurrent.futures import ThreadPoolExecutor
          import os

          # ПУТИ К НАШИМ СОКРОВИЩАМ
          FILES_TO_CLEAN = [
              "v2ray_config_collector/data/sources/sources.txt",
              "v2ray_config_collector/data/sources/sources1.txt"  # Теперь и Телеграм!
          ]
          # Фиксируем черный список в рабочей структуре проекта
          BLACKLIST_FILE = "v2ray_config_collector/data/sources/cleaned_urls.txt"

          def is_alive(url):
              try:
                  # Быстрая проверка (7 секунд), чтобы не заставлять тебя ждать
                  r = requests.get(url, timeout=7, stream=True, headers={'User-Agent': 'Mozilla/5.0'})
                  if r.status_code == 200:
                      return url
              except:
                  return None
              return None

          # Загружаем черный список, чтобы не тратить время на проверку трупов
          blacklist_set = set()
          if os.path.exists(BLACKLIST_FILE):
              with open(BLACKLIST_FILE, "r", encoding="utf-8") as f:
                  blacklist_set = set(line.strip() for line in f if line.strip())

          for src_path in FILES_TO_CLEAN:
              if not os.path.exists(src_path):
                  print(f"⚠️ Файл {src_path} пока пуст, пропускаю...")
                  continue

              with open(src_path, "r", encoding="utf-8") as f:
                  # Убираем дубликаты прямо на входе
                  raw_urls = list(set(line.strip() for line in f if line.strip()))
              
              # СТРОГО ВНУТРИ ЦИКЛА: Фильтруем текущий файл по черному списку
              input_urls = [url for url in raw_urls if url not in blacklist_set]
              ignored_dead = len(raw_urls) - len(input_urls)
              
              if ignored_dead > 0:
                  print(f"🧹 В файле {src_path} отфильтровано {ignored_dead} ссылок из черного списка.")

              if not input_urls:
                  print(f"🪐 В {src_path} нет новых ссылок для анализа.")
                  continue

              print(f"📡 Проверяю {src_path}: {len(input_urls)} ссылок...")

              # Ускоряем проверку в 50 потоков 🚀
              with ThreadPoolExecutor(max_workers=50) as executor:
                  results = list(executor.map(is_alive, input_urls))

              alive_urls = set(r for r in results if r)
              to_stay = []
              to_blacklist = []

              for url in input_urls:
                  if url in alive_urls:
                      to_stay.append(url)
                  else:
                      to_blacklist.append(url)

              # Сохраняем только живое чистое топливо для текущего файла
              with open(src_path, "w", encoding="utf-8") as f:
                  for url in to_stay:
                      f.write(url + "\n")
              
              # Дописываем свежие трупы в черный список и обновляем текущий набор в памяти
              if to_blacklist:
                  os.makedirs(os.path.dirname(BLACKLIST_FILE), exist_ok=True)
                  with open(BLACKLIST_FILE, "a", encoding="utf-8") as f:
                      for url in set(to_blacklist):
                          f.write(url + "\n")
                          blacklist_set.add(url)
              
              print(f"✅ {src_path}: {len(to_stay)} живых сохранено, {len(to_blacklist)} улетело в черный список.")
          EOF

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add v2ray_config_collector/data/sources/
          if ! git diff --cached --quiet; then
            git commit -m "🧹 Порядок в обоих цехах: мертвые души удалены! 💋💍🍀"
            git pull --rebase origin main
            git push origin main
          else
            echo "Нет изменений для коммита"
          fi
