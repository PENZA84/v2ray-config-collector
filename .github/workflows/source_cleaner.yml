name: "🧹 Чистильщик обоих цехов 💋"

on:
  workflow_dispatch: 

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sort and Clean Everything
        run: |
          python <<EOF
          import requests
          from concurrent.futures import ThreadPoolExecutor
          import os

          FILES_TO_CLEAN = ["v2ray_config_collector/data/sources/sources.txt", "v2ray_config_collector/data/sources/sources1.txt"]
          BLACKLIST_FILE = "v2ray_config_collector/data/sources/cleaned_urls.txt"

          def is_alive(url):
              try:
                  r = requests.get(url, timeout=7, stream=True, headers={'User-Agent': 'Mozilla/5.0'})
                  return url if r.status_code == 200 else None
              except: return None

          blacklist_set = set()
          if os.path.exists(BLACKLIST_FILE):
              with open(BLACKLIST_FILE, "r", encoding="utf-8") as f:
                  blacklist_set = {line.strip() for line in f if line.strip()}

          for src_path in FILES_TO_CLEAN:
              if not os.path.exists(src_path): continue
              with open(src_path, "r", encoding="utf-8") as f:
                  urls = {line.strip() for line in f if line.strip() and line.strip() not in blacklist_set}
              
              if not urls: continue

              with ThreadPoolExecutor(max_workers=30) as executor:
                  results = list(filter(None, executor.map(is_alive, urls)))
              
              alive = set(results)
              dead = urls - alive

              with open(src_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(sorted(list(alive))) + "\n")
              
              if dead:
                  with open(BLACKLIST_FILE, "a", encoding="utf-8") as f:
                      f.write("\n".join(sorted(list(dead))) + "\n")
                  blacklist_set.update(dead)
          EOF

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add v2ray_config_collector/data/sources/
          if ! git diff --cached --quiet; then
            git commit -m "🧹 Порядок в цехах: мертвые души удалены! 💋"
            git push origin HEAD:${{ github.ref }}
          else
            echo "Нет изменений для коммита"
          fi
