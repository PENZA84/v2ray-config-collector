name: "🧹 Чистильщик всех трёх цехов 💋"

on:
  workflow_dispatch: # 🧤 Только твой ручной запуск

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sort and Clean Everything
        run: |
          python <<EOF
          import requests
          from concurrent.futures import ThreadPoolExecutor
          import os
          import sys

          sys.stdout.reconfigure(line_buffering=True)

          # ПУТИ - ОСТАВЛЯЕМ КАК ЕСТЬ (ТЫ СКАЗАЛ ОНИ ПРАВИЛЬНЫЕ)
          BASE_SOURCES_DIR = "v2ray_config_collector/data/sources"
          RAW_DEAD_FILE = "v2ray_config_collector/data/raw_incoming/deep_raw_collected.txt"
          
          FILES_TO_CHECK = [
              os.path.join(BASE_SOURCES_DIR, "sources.txt"),
              os.path.join(BASE_SOURCES_DIR, "sources1.txt"),
              os.path.join(BASE_SOURCES_DIR, "grabber_targets.txt")
          ]

          print("💋 [Завод]: Запуск проверки ссылок и изоляции хлама...", flush=True)

          # ... (твоя логика функции check_link и обработки остается БЕЗ ИЗМЕНЕНИЙ) ...
          def check_link(url):
              try:
                  clean_url = url
                  if ".txt" in url.lower() or ".yaml" in url.lower() or ".yml" in url.lower():
                      if "raw.githubusercontent.com" in url:
                          clean_url = url.split('?')[0]
                  headers = {'User-Agent': 'Mozilla/5.0'}
                  r = requests.get(clean_url, timeout=8, stream=True, headers=headers)
                  return (url, r.status_code)
              except:
                  return (url, "TIMEOUT_OR_ERROR")

          existing_dead = set()
          if os.path.exists(RAW_DEAD_FILE):
              with open(RAW_DEAD_FILE, "r", encoding="utf-8") as f:
                  existing_dead = {line.strip() for line in f if line.strip() and not line.startswith('#')}

          new_dead_pool = set()
          for src_path in FILES_TO_CHECK:
              if not os.path.exists(src_path):
                  continue
              with open(src_path, "r", encoding="utf-8") as f:
                  urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]
              with ThreadPoolExecutor(max_workers=30) as executor:
                  results = list(executor.map(check_link, urls))
              
              alive_urls = [url for url, status in results if status == 200]
              for url, status in results:
                  if status != 200:
                      new_dead_pool.add(f"{url} | Error: {status}")

              with open(src_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(sorted(alive_urls)) + "\n")

          final_dead_pool = existing_dead.union(new_dead_pool)
          if final_dead_pool:
              os.makedirs(os.path.dirname(RAW_DEAD_FILE), exist_ok=True)
              with open(RAW_DEAD_FILE, "w", encoding="utf-8") as f:
                  f.write("# БУНКЕР ОТХОДОВ\n\n" + "\n".join(sorted(list(final_dead_pool))) + "\n")
          EOF

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ДОБАВЛЯЕМ ЯВНО ФАЙЛЫ, А НЕ ВСЮ ПАПКУ, ЧТОБЫ ИЗБЕЖАТЬ 128 ОШИБКИ
          git add v2ray_config_collector/data/sources/*.txt
          git add v2ray_config_collector/data/raw_incoming/deep_raw_collected.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "🧹 Порядок в трёх цехах: хлам изолирован! 💋"
            git push origin HEAD:${{ github.ref }}
          else
            echo "Нет изменений для коммита."
          fi
